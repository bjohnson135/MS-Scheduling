# Nginx config for the React frontend containers (app/, myaccount/).
# Faraday already routes /app/* and /myaccount/* to these containers and
# strips no prefix (StripPrefix=false in faraday/services/services.go), so
# the upstream sees the full path. This config serves the SPA bundle and
# falls back to index.html for client-side routes.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck (Faraday hits per-service /healthz via the catch-all).
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Don't cache HTML — the bundle filenames are content-hashed so they're
  # fine, but the entry HTML must always be fresh.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Long-cache hashed assets.
  location ~* \.(js|css|png|jpg|svg|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — any unknown path serves the entry HTML.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
