# Pinned tool versions for the MS-Scheduling foundation.
# Run `mise install` (or `mise use`) to pull all of these.
# See: https://mise.jdx.dev/

[tools]
go = "1.23.4"
node = "20.18.0"
pnpm = "9.12.0"
buf = "1.45.0"
golangci-lint = "1.61.0"
"go:github.com/cosmtrek/air" = "1.61.0"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = "4.18.1"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.34.2"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.5.1"

[env]
# These are picked up by services through .env (see .env.schema)
STAFFJOY_PORT = "8080"
