name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go-test:
    name: Go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true
      - run: go vet ./...
      - run: go test -race -short -count=1 -timeout=300s ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, myaccount]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Install
        working-directory: ${{ matrix.app }}
        run: pnpm install --no-frozen-lockfile
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm run build

  compose-config:
    name: docker-compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          touch .env
          docker compose config >/dev/null
